name: Audit cask

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tap this checkout
        run: |
          brew --version
          brew tap nurockplayer/tap "$GITHUB_WORKSPACE"
          brew trust --cask nurockplayer/tap/tachiko-sheet

      - name: Style and audit
        run: |
          brew style --cask nurockplayer/tap/tachiko-sheet
          brew audit --cask --strict --online nurockplayer/tap/tachiko-sheet

      - name: Install and uninstall
        run: |
          brew install --cask nurockplayer/tap/tachiko-sheet
          test -d "/Applications/Tachiko Sheet.app"
          brew uninstall --cask tachiko-sheet
          test ! -e "/Applications/Tachiko Sheet.app"
